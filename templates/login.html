<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#7D53F6" />
    <title>Sign in — Lumina</title>
    <link rel="stylesheet" href="/static/css/portal.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237D53F6'/%3E%3Cpath d='M10 8.5v15h12' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  </head>
  <body class="gate">
    <div class="gate-shell">
      <aside class="gate-aside">
        <p class="gate-mark">Lumina</p>
        <h2>A tutor for the course you are actually studying.</h2>
        <p>Lesson plans, a conversation, and quizzes in the same thread.</p>
      </aside>
    <main class="auth">
      <a class="brand" href="/">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="22" height="22">
            <path d="M10 8.5v15h12" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </span>
        Lumina
      </a>
      <section class="auth-card">
        <p class="eyebrow">Sign in</p>
        <h1>Welcome back.</h1>
        <p class="lede">Continue a course, a lesson, or an assessment.</p>
        <form method="post" action="/login">
          <!--ERROR-->
          <div class="field">
            <label for="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="username"
              maxlength="180"
              required
              value="<!--EMAIL-->"
            />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <span class="password-wrap">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                maxlength="128"
                required
              />
              <button class="reveal" type="button" data-reveal="password" aria-controls="password">Show</button>
            </span>
          </div>
          <button class="btn btn-solid" type="submit">Sign in</button>
        </form>
        <p class="auth-note">New to Lumina? <a href="/signup">Create an account</a></p>
      </section>
    </main>
    </div>
    <script src="/static/js/auth.js"></script>
  </body>
</html>
